name: score-decisions

# AI 판정 채점만 매 영업일 예약 실행한다.
#   #371 에서 장 마감 뒤 자동 호출 중지 정책으로 flow-snapshot 예약을 지우면서, 그 디스패처에
#   묶여 있던 채점도 함께 멈췄다(2026-07-27 이후 pending 누적). 채점은 pending 행의 일봉 종가만
#   조회하는 하루 1회 작업이라 단타 자동 호출과 무관하다. 수급 스냅샷(flow-snapshot)은 수동 유지.
#
# 사전 설정: 저장소 Actions secret `CRON_SECRET`(Vercel Production 과 같은 값) — flow-snapshot 과 공용.

on:
  schedule:
    # 17:10 KST(평일) = 08:10 UTC. 장마감 후 당일 종가 확정 뒤 채점.
    - cron: "10 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger score-decisions cron
        run: |
          resp=$(curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://trading-signal-frontend.vercel.app/api/cron/score-decisions")
          echo "response: $resp"
