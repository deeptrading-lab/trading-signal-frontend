name: flow-snapshot

# 장 마감 뒤 자동 분석·호출 중지 정책에 따라 예약 실행은 두지 않는다.
# 수급 스냅샷·AI 판정 채점이 필요할 때 운영자가 수동으로 트리거한다.
#
# 사전 설정: 저장소 Settings → Secrets and variables → Actions 에 `CRON_SECRET` 추가
#   (Vercel Production 의 CRON_SECRET 과 같은 값).

on:
  workflow_dispatch: {} # 수동 실행만 허용(백필/점검용)

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flow-snapshot cron
        run: |
          resp=$(curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://trading-signal-frontend.vercel.app/api/cron/flow-snapshot")
          echo "response: $resp"
